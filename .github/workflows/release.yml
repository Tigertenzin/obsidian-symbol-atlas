# Publishes a GitHub release whenever a version tag (e.g. "1.3.0") is pushed.
# The tag must match manifest.json's version, and the annotated tag's message
# becomes the release notes. Obsidian installs from the attached main.js,
# manifest.json and styles.css.
name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Check tag matches manifest version
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # actions/checkout can leave the tag lightweight; refetch it so the
          # annotation (the release notes) is available locally.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-from-tag \
            main.js manifest.json styles.css
